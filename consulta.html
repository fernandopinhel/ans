<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; form-action 'self'; base-uri 'self'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#5f3696">
    <meta name="description" content="Consulta das regras de triagem do sistema Triagem NIP.">
    <title>Regras de triagem | Triagem NIP</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600&amp;family=Figtree:wght@400;500;600&amp;display=swap">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <div class="app">
      <div class="rail"></div>
      <header class="appbar"></header>

      <main class="content" id="conteudo" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <span class="eyebrow" id="pagina-grupo">Regras de triagem</span>
            <h1 id="pagina-titulo">Consulta</h1>
            <p id="pagina-descricao"></p>
          </div>
          <div class="page-head__actions">
            <a class="btn btn--primary" id="pagina-novo" href="cadastro.html"></a>
          </div>
        </div>

        <section class="card filters no-print" aria-labelledby="filtros-titulo">
          <div class="card__head"><h2 id="filtros-titulo">Filtros</h2></div>
          <form id="filtros" role="search" novalidate>
            <div class="form-grid"></div>
            <div class="filters__actions">
              <button class="btn" type="reset">Limpar filtros</button>
              <button class="btn btn--primary" type="submit"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/icons.svg#i-search"/></svg> Buscar</button>
            </div>
          </form>
        </section>

        <section class="card card--flush" aria-labelledby="resultado-titulo">
          <div class="table-toolbar">
            <div>
              <h2 id="resultado-titulo">Resultados</h2>
              <p id="resultado-total"></p>
            </div>
            <div class="btn-row">
              <button class="btn btn--sm" id="exportar" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/icons.svg#i-download"/></svg> Baixar CSV</button>
              <button class="btn btn--sm" id="imprimir" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/icons.svg#i-print"/></svg> Imprimir</button>
            </div>
          </div>
          <div id="resultado"></div>
        </section>
      </main>

      <footer class="app-footer"></footer>
    </div>

    <script src="js/common.js"></script>
    <script src="js/data.js"></script>
    <script src="js/consulta.js"></script>
  </body>
</html>
